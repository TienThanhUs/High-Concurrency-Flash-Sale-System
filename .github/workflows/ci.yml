name: FlashMart CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-ci:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-source

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend-source/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type-check and build Vite bundle
        run: npm run build

  backend-ci:
    name: Backend (Java 21 & Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-source

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin) with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: ./backend-source/pom.xml

      - name: Ensure mvnw is executable
        run: chmod +x mvnw

      - name: Run Unit & Integration Tests
        run: ./mvnw test -B

  docker-publish:
    name: Build & Push Docker Image (GHCR)
    runs-on: ubuntu-latest
    needs: [ backend-ci ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-source
          file: ./backend-source/Dockerfile
          push: true
          tags: |
            ghcr.io/tienthanhus/high-concurrency-flash-sale-system:latest
            ghcr.io/tienthanhus/high-concurrency-flash-sale-system:${{ github.sha }}
